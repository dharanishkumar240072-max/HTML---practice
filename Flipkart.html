
<!DOCTYPE html>
<html>
<head>
    <title>Flipkart Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <h2 class="logo">Flipkart</h2>

        <input type="text" placeholder="Search for products">

        <button>Login</button>

        <h3>Cart 🛒</h3>
    </nav>

    <!-- Categories -->
    <div class="categories">
        <div>Mobiles</div>
        <div>Fashion</div>
        <div>Electronics</div>
        <div>Home</div>
        <div>Appliances</div>
        <div>Grocery</div>
    </div>

    <!-- Products -->
    <h2 class="heading">Best Deals</h2>

    <div class="products">

        <div class="product">
            <img src="https://placehold.co/150x150?text=Mobile">
            <h3>Smartphone</h3>
            <p>₹12,999</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <img src="https://placehold.co/150x150?text=Laptop">
            <h3>Laptop</h3>
            <p>₹45,999</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <img src="https://placehold.co/150x150?text=Watch">
            <h3>Smart Watch</h3>
            <p>₹1,999</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <img src="https://placehold.co/150x150?text=Headphones">
            <h3>Headphones</h3>
            <p>₹999</p>
            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>
